<app-header></app-header>

<div class="feed-main">

  <!-- Left nav -->
  <nav class="feed-nav">
    <!-- Toxicity tag filters -->
    <div class="feed-nav__tag-filters">
      <div class="feed-nav__tag-filter-item" *ngFor="let tag of togglableTags">
        <label class="feed-nav__tag-label" for="tag-switch-{{tag}}">{{ tag }}</label>
        <div class="feed-nav__tag-switch">
          <input type="checkbox" id="tag-switch-{{tag}}" [checked]="!hiddenTags.includes(tag)" (change)="onTagToggleChange(tag, $event)">
          <div class="feed-nav__tag-switch-slider"></div>
        </div>
      </div>
      <a class="feed-nav__item" (click)="clearTagFilters()">Clear tag filters</a>
    </div>

    <!-- Active thread filter -->
    <div class="feed-nav__active-thread" *ngIf="selectedThread">{{ selectedThread }}<button
        class="feed-nav__active-thread-clear" (click)="clearThreadFilter()">✕</button></div>

    <div class="feed-nav__bottom">
      <a class="feed-nav__item feed-nav__item--profile" href="#">👤 My Profile</a>
    </div>
  </nav>

  <!-- Center: composer + posts -->
  <section class="feed-center">

    <div class="feed-composer-trigger">
      <div class="feed-composer-trigger__bar" (click)="openModal()">
        <span>What's on your mind? Share something…</span>
      </div>
    </div>
    <!-- -------------------------------- Posts -------------------------------- -->
    <div class="feed-posts">
      <app-post-card *ngFor="let post of posts; trackBy: trackById" [thread]="post.thread" [username]="post.username"
        [iconUrl]="post.iconUrl" [timePosted]="post.timePosted" [title]="post.title" [message]="post.message"
        [likeCount]="post.likeCount" [commentCount]="post.commentCount" [toxicityTags]="post.toxicityTags"
        [userVote]="post.userVote" [postId]="post.postId"
        [isBlurred]="post.isBlurred" [isLikedByUser]="post.isLikedByUser" />
      <div class="feed-posts__empty" *ngIf="posts.length === 0">No posts yet. Be the first to share!</div>
    </div>

  </section>

  <!-- Right: trending -->
  <aside class="feed-trending">
    <h3 class="feed-trending__title">🔥 Trending Today</h3>
    <div class="feed-trending__thread-filter">
      <label for="thread-input-trending">Filter by thread:</label>
      <input id="thread-input-trending" list="thread-list-trending" class="feed-trending__thread-input"
        placeholder="Select or type thread..." [(ngModel)]="postThreadForFilter"
        (ngModelChange)="onThreadFilterChange()" />
      <datalist id="thread-list-trending">
        <option *ngFor="let tc of threadCounts" [value]="tc.thread">
          {{ tc.thread }} ({{ tc.count }})
        </option>
      </datalist>
      <button class="feed-trending__clear-button" *ngIf="selectedThread" (click)="clearThreadFilter()">Clear</button>
    </div>

    <ul class="feed-trending__list">
      <li *ngFor="let tc of threadCounts | slice:0:5; let i = index" class="feed-trending__item"
        (click)="selectThread(tc.thread)">
        <span class="feed-trending__rank">{{ i + 1 }}</span>
        <div class="feed-trending__info">
          <span class="feed-trending__thread">{{ tc.thread }}</span>
          <span class="feed-trending__posts">{{ tc.count }} posts</span>
        </div>
      </li>
    </ul>
  </aside>

</div>

<!-- ── Composer Modal ─────────────────────────────────────────────────────── -->
<div class="modal-backdrop" [class.modal-backdrop--open]="modalOpen" (click)="closeModal()"></div>

<div class="modal-card" [class.modal-card--open]="modalOpen">
  <div class="modal-card__header">
    <span class="modal-card__title">Create Post</span>
    <button class="modal-card__close" (click)="closeModal()">✕</button>
  </div>

  <div class="modal-card__body">
    <div class="modal-editor">
      <input class="modal-editor__title" type="text" placeholder="Post title…" [(ngModel)]="postTitle" />
      <input class="modal-editor__thread" type="text" placeholder="Thread (e.g., #dev)…" [(ngModel)]="postThread" />

      <div class="modal-editor__toolbar">
        <button class="modal-editor__tool" title="Bold" (click)="wrapSelection('**','**')"><b>B</b></button>
        <button class="modal-editor__tool" title="Italic" (click)="wrapSelection('_','_')"><i>I</i></button>
        <button class="modal-editor__tool" title="Numbered list" (click)="wrapSelection('1. ','')">1.</button>
        <button class="modal-editor__tool" title="Bullet list" (click)="wrapSelection('- ','')">•</button>
        <span class="modal-editor__divider"></span>
        <label class="modal-editor__tool" title="Add media">
          📷
          <input #fileInput type="file" accept="image/*" hidden (change)="onMediaSelected($event)" />
        </label>
      </div>

      <textarea #bodyArea class="modal-editor__body" placeholder="Write your post… (supports **bold** and _italic_)"
        [(ngModel)]="postBody" rows="6"></textarea>

      <input class="modal-editor__link" type="url" placeholder="🔗 Paste a link (optional)…" [(ngModel)]="postLink" />

      <div class="modal-editor__media" *ngIf="mediaPreviewUrl">
        <img [src]="mediaPreviewUrl" alt="Media preview" class="modal-editor__media-img" />
        <button class="modal-editor__media-remove" (click)="removeMedia()">✕</button>
      </div>
    </div>

    <div class="modal-preview">
      <div class="modal-preview__label">Preview</div>
      <div class="modal-preview__title">{{ postTitle || 'Post title will appear here' }}</div>
      <div class="modal-preview__body" [innerHTML]="previewHtml || 'Your post body will appear here…'"></div>
      <div class="modal-preview__link" *ngIf="postLink">
        <span>🔗</span> <a [href]="postLink" target="_blank">{{ postLink }}</a>
      </div>
      <img *ngIf="mediaPreviewUrl" [src]="mediaPreviewUrl" class="modal-preview__img" alt="preview" />
    </div>
  </div>

  <div class="modal-card__footer">
    <button class="modal-card__cancel" (click)="closeModal()">Cancel</button>
    <button class="modal-card__submit" (click)="submitPost()" [disabled]="submitting || !postBody.trim()">
      {{ submitting ? 'Posting…' : 'Post' }}
    </button>
  </div>
</div>
